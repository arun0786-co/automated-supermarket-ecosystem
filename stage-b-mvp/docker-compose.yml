# Stage B Docker Compose, run with: docker compose up
# Each service listed here maps to a chapter in the ASE-PRIME spec PDF.

services:

  # ── Service A: Product Core (Chapter 4) ─────────────────────
  product-core:
    build: ./services/product-core
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=postgres
      - DB_PASS=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ── Service C: Fintech Vault / Blockchain (Chapter 6) ───────
  fintech-vault:
    build: ./services/fintech-vault
    ports:
      - "3002:3002"
    environment:
      - CHAIN_RPC=http://hardhat-node:8545
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    depends_on:
      hardhat-node:
        condition: service_healthy

  # ── Service D: AI Recommendations (Chapter 7) ───────────────
  ai-engine:
    build: ./services/ai-engine
    ports:
      - "8000:8000"
    environment:
      - PRODUCT_CORE_URL=http://product-core:3001
    depends_on:
      - product-core

  # ── Databases ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ase_products
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ase", "-d", "ase_products"]
      interval: 2s
      retries: 30
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1
    ports:
      - "6379:6379"

  # ── Local Blockchain (replaces Hyperledger Besu in dev) ─────
  hardhat-node:
    # same image as the vault so `hardhat node` runs inside the hardhat project
    build: ./services/fintech-vault
    command: ["npx", "hardhat", "node", "--hostname", "0.0.0.0"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_blockNumber'})}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      retries: 30

  # ── MQTT Broker (replaces WebSocket in Stage B) ─────────────
  mqtt-broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # ── API Gateway ─────────────────────────────────────────────
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - product-core
      - fintech-vault
      - ai-engine

volumes:
  postgres_data:
