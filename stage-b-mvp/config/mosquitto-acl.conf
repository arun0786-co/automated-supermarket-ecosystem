# each role can only touch its own topics, so a compromised trolley can't forge
# store alerts, fake a checkout result or see anyone's scans

user fleet
topic read trolley/+/position
topic read trolley/+/scan
topic write trolley/+/led
topic write trolley/+/checkout
topic write store/alerts

user trolley
topic write trolley/+/position
topic write trolley/+/scan
topic read trolley/+/led
topic read trolley/+/checkout
