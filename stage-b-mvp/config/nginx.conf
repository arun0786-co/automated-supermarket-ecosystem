events {
    worker_connections 1024;
}

http {
    # all services behind a single domain — no CORS headaches from the frontend
    upstream product_core {
        server product-core:3001;
    }

    upstream fintech_vault {
        server fintech-vault:3002;
    }

    upstream ai_engine {
        server ai-engine:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # common headers
        add_header X-ASE-Stage "B";
        add_header X-Content-Type-Options nosniff;

        # product catalog
        location /api/products {
            proxy_pass http://product_core;
            proxy_set_header Host $host;
        }

        # blockchain wallet + ledger + checkout
        location /api/wallet {
            proxy_pass http://fintech_vault;
            proxy_set_header Host $host;
        }

        location /api/checkout {
            proxy_pass http://fintech_vault;
            proxy_set_header Host $host;
        }

        location /api/ledger {
            proxy_pass http://fintech_vault;
            proxy_set_header Host $host;
        }

        # ai recommendations
        location /api/recommendations {
            proxy_pass http://ai_engine;
            proxy_set_header Host $host;
        }

        # health checks for each service
        location /health/products { proxy_pass http://product_core/api/health; }
        location /health/vault    { proxy_pass http://fintech_vault/api/health; }
        location /health/ai       { proxy_pass http://ai_engine/api/health; }

        # gateway health
        location /health {
            return 200 '{"status":"ok","gateway":"nginx","stage":"B"}';
            add_header Content-Type application/json;
        }
    }
}
