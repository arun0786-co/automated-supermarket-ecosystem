events {
    worker_connections 1024;
}

http {
    # docker's dns. with "resolve" below, a recreated container gets picked up without a reload,
    # and nginx can start before every service exists
    resolver 127.0.0.11 valid=10s ipv6=off;

    # all services behind a single domain, no CORS headaches from the frontend
    upstream product_core {
        zone upstreams 256k;
        server product-core:3001 resolve;
    }

    upstream vision {
        zone upstreams;
        server vision:8001 resolve;
    }

    upstream fintech_vault {
        zone upstreams;
        server fintech-vault:3002 resolve;
    }

    upstream ai_engine {
        zone upstreams;
        server ai-engine:8000 resolve;
    }

    upstream fleet_engine {
        zone upstreams;
        server fleet-engine:3003 resolve;
    }

    upstream auth_service {
        zone upstreams;
        server auth-service:3004 resolve;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # chapter 3.1.2: the gateway handles rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    # password guessing costs real cpu, so these get far less
    limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name localhost;

        # common headers
        add_header X-ASE-Stage "B" always;
        add_header X-Content-Type-Options nosniff always;

        # ---- token checks. not reachable from outside ----
        location = /_auth {
            internal;
            proxy_pass http://auth_service/internal/verify;
            # the body is dropped here, so the 1m default would only refuse big camera bursts
            client_max_body_size 0;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        location = /_auth_admin {
            internal;
            proxy_pass http://auth_service/internal/verify?role=admin;
            # the body is dropped here, so the 1m default would only refuse big camera bursts
            client_max_body_size 0;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # plain json for the clients instead of nginx's html pages
        error_page 401 = @unauthorized;
        error_page 403 = @forbidden;
        error_page 429 = @too_many;
        location @unauthorized {
            default_type application/json;
            return 401 '{"error":"not logged in"}';
        }
        location @forbidden {
            default_type application/json;
            return 403 '{"error":"not allowed"}';
        }
        location @too_many {
            default_type application/json;
            return 429 '{"error":"too many requests"}';
        }

        # ---- open: logging in, and health checks ----
        location ~ ^/api/auth/(login|register|refresh)$ {
            limit_req zone=login burst=20 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
        }

        location /api/auth {
            limit_req zone=api burst=200 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
        }

        location /health/products { proxy_pass http://product_core/api/health; }
        location /health/vision   { proxy_pass http://vision/api/health; }
        location /health/vault    { proxy_pass http://fintech_vault/api/health; }
        location /health/ai       { proxy_pass http://ai_engine/api/health; }
        location /health/fleet    { proxy_pass http://fleet_engine/api/health; }
        location /health/auth     { proxy_pass http://auth_service/api/health; }

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx","stage":"B"}';
        }

        # ---- any logged in user ----
        location /api/products {
            include /etc/nginx/nginx-protected.conf;
            proxy_pass http://product_core;
        }

        location /api/recommendations {
            include /etc/nginx/nginx-protected.conf;
            proxy_pass http://ai_engine;
        }

        # the service checks these belong to the person asking
        location /api/wallets/ {
            include /etc/nginx/nginx-protected.conf;
            proxy_pass http://fleet_engine;
        }

        location /api/fleet/cart/ {
            include /etc/nginx/nginx-protected.conf;
            proxy_pass http://fleet_engine;
        }

        # the live feed. browsers can't set headers on a websocket, so the token is in the url,
        # which is why this location is left out of the access log
        location /ws {
            include /etc/nginx/nginx-protected.conf;
            access_log off;
            proxy_pass http://fleet_engine;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
        }

        # ---- store staff only ----
        # trolleys take stock through the fleet engine, customers never do it directly
        location ~ ^/api/products/[^/]+/(pick|release)$ {
            include /etc/nginx/nginx-admin.conf;
            proxy_pass http://product_core;
        }

        # sensor fusion. a burst is 5 frames, well past nginx's default 1m body limit
        location /api/vision {
            include /etc/nginx/nginx-admin.conf;
            client_max_body_size 25m;
            proxy_pass http://vision;
        }

        # a customer must never be able to charge a wallet or mint money, so the vault stays
        # behind staff access and customers get their balance from /api/wallets
        location /api/wallet/ {
            include /etc/nginx/nginx-admin.conf;
            proxy_pass http://fintech_vault;
        }

        location /api/checkout {
            include /etc/nginx/nginx-admin.conf;
            proxy_pass http://fintech_vault;
        }

        location /api/ledger {
            include /etc/nginx/nginx-admin.conf;
            proxy_pass http://fintech_vault;
        }

        location = /api/wallets {
            include /etc/nginx/nginx-admin.conf;
            proxy_pass http://fleet_engine;
        }

        location /api/fleet/trolleys {
            include /etc/nginx/nginx-admin.conf;
            proxy_pass http://fleet_engine;
        }

        # ---- only the fleet engine sends these, and it talks to the service directly ----
        location = /api/recommendations/feedback {
            return 404;
        }

        location /internal {
            return 404;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"not found"}';
        }
    }
}
