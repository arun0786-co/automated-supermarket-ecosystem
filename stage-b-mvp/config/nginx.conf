events {
    worker_connections 1024;
}

http {
    # all services behind a single domain, no CORS headaches from the frontend
    upstream product_core {
        server product-core:3001;
    }

    upstream vision {
        server vision:8001;
    }

    upstream fintech_vault {
        server fintech-vault:3002;
    }

    upstream ai_engine {
        server ai-engine:8000;
    }

    upstream fleet_engine {
        server fleet-engine:3003;
    }

    upstream auth_service {
        server auth-service:3004;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        # common headers
        add_header X-ASE-Stage "B";
        add_header X-Content-Type-Options nosniff;

        # product catalog
        location /api/products {
            proxy_pass http://product_core;
            proxy_set_header Host $host;
        }

        # sensor fusion. a burst is 5 frames, well past nginx's default 1m body limit
        location /api/vision {
            client_max_body_size 25m;
            proxy_pass http://vision;
            proxy_set_header Host $host;
        }

        # blockchain wallet + ledger + checkout
        location /api/wallet {
            proxy_pass http://fintech_vault;
            proxy_set_header Host $host;
        }

        location /api/checkout {
            proxy_pass http://fintech_vault;
            proxy_set_header Host $host;
        }

        location /api/ledger {
            proxy_pass http://fintech_vault;
            proxy_set_header Host $host;
        }

        # ai recommendations
        location /api/recommendations {
            proxy_pass http://ai_engine;
            proxy_set_header Host $host;
        }

        # logins
        location /api/auth {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
        }

        # wallet cards and carts
        location /api/wallets {
            proxy_pass http://fleet_engine;
            proxy_set_header Host $host;
        }

        location /api/fleet {
            proxy_pass http://fleet_engine;
            proxy_set_header Host $host;
        }

        # live feed for the dashboard and the app
        location /ws {
            proxy_pass http://fleet_engine;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
        }

        # health checks for each service
        location /health/products { proxy_pass http://product_core/api/health; }
        location /health/vision   { proxy_pass http://vision/api/health; }
        location /health/vault    { proxy_pass http://fintech_vault/api/health; }
        location /health/ai       { proxy_pass http://ai_engine/api/health; }
        location /health/fleet    { proxy_pass http://fleet_engine/api/health; }
        location /health/auth     { proxy_pass http://auth_service/api/health; }

        # gateway health
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx","stage":"B"}';
        }
    }
}
