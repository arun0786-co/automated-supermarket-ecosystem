# chapter 3.1.2: mutual tls between services. needs istio installed in the cluster.
# add this component to an overlay to turn it on
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - peer-authentication.yaml
patches:
  - target:
      kind: Namespace
      name: ase
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          istio-injection: enabled
