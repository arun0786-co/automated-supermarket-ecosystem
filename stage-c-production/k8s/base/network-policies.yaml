# chapter 10.1 treats the local network as hostile. nothing talks to anything by default, and each
# service lists exactly who may reach it
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-gateway
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 80
---
# trolleys connect from the store network, and still have to log in
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-mqtt-broker
spec:
  podSelector:
    matchLabels:
      app: mqtt-broker
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 1883
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: product-core
        - podSelector:
            matchLabels:
              app: auth-service
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
