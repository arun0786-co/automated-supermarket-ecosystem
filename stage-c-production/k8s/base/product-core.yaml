# stateless thanks to redis taking the counts, so it scales out
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-core
  labels:
    app: product-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-core
  template:
    metadata:
      labels:
        app: product-core
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: product-core
          image: ghcr.io/arun0786-co/ase-product-core:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: ase-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_URL
              value: "redis://redis:6379"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            periodSeconds: 10
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /api/health
              port: 3001
            periodSeconds: 3
            failureThreshold: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: product-core
spec:
  selector:
    app: product-core
  ports:
    - port: 3001
      targetPort: 3001
