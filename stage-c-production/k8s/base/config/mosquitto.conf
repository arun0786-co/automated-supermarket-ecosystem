# chapter 10 treats the store network as hostile, so nothing connects anonymously
allow_anonymous false
password_file /mosquitto/passwords
acl_file /mosquitto/acl

listener 1883

# a burst of 5 frames at most, base64 encoded
message_size_limit 25000000

# topic structure for ASE-PRIME stage B
# trolley/<id>/position: userId, x, y from the trolley hardware
# trolley/<id>/scan: eventId, weightDelta, frames or a simulated detection
# trolley/<id>/led: red or green, sent back to the trolley
# trolley/<id>/checkout: checkout result (ok, hash, total)
# store/alerts: low stock, failed checkouts
