# included by every location that needs a logged in user. identity headers are always
# overwritten here, so a client can't send its own
auth_request /_auth;
auth_request_set $auth_user $upstream_http_x_user_id;
auth_request_set $auth_role $upstream_http_x_user_role;
auth_request_set $auth_exp $upstream_http_x_token_exp;
proxy_set_header X-User-Id $auth_user;
proxy_set_header X-User-Role $auth_role;
proxy_set_header X-Token-Exp $auth_exp;
proxy_set_header Host $host;
limit_req zone=api burst=200 nodelay;
