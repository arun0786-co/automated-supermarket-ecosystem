name: test

on:
  push:
  pull_request:

jobs:
  api-simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-a-simulation/api-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stage-a-simulation/api-simulator/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test

  web-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-a-simulation/web-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stage-a-simulation/web-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-a-simulation/mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  product-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-b-mvp/services/product-core
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node --test only expands the src/**/*.test.ts glob from node 21 on
          node-version: 22
          cache: npm
          cache-dependency-path: stage-b-mvp/services/product-core/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  fintech-vault:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-b-mvp/services/fintech-vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stage-b-mvp/services/fintech-vault/package-lock.json
      - run: npm ci
      - run: npx hardhat compile
      - run: npx tsc --noEmit -p .
      - run: npx hardhat test

  ai-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-b-mvp/services/ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  vision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-b-mvp/services/vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  fleet-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-b-mvp/services/fleet-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stage-b-mvp/services/fleet-engine/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  trolley-sim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-b-mvp/services/trolley-sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stage-b-mvp/services/trolley-sim/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  auth-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-b-mvp/services/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stage-b-mvp/services/auth-service/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  stage-b-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the feed recorder uses node's built-in websocket client
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: stage-a-simulation/mobile-app
      - run: bash stage-b-mvp/e2e/run.sh

  stage-b-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash stage-b-mvp/e2e/run.sh
        env:
          E2E_OVERLAY: observability
          E2E_BROWSER: "0"

  stage-b-besu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash stage-b-mvp/e2e/run.sh
        env:
          E2E_OVERLAY: besu
          E2E_BROWSER: "0"
