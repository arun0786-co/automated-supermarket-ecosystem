name: test

on:
  push:
  pull_request:

jobs:
  api-simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-a-simulation/api-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stage-a-simulation/api-simulator/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test

  web-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-a-simulation/web-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stage-a-simulation/web-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-a-simulation/mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  product-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-b-mvp/services/product-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node --test only expands the src/**/*.test.ts glob from node 21 on
          node-version: 22
          cache: npm
          cache-dependency-path: stage-b-mvp/services/product-core/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  fintech-vault:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-b-mvp/services/fintech-vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stage-b-mvp/services/fintech-vault/package-lock.json
      - run: npm ci
      - run: npx hardhat compile
      - run: npx tsc --noEmit -p .
      - run: npx hardhat test

  ai-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-b-mvp/services/ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
