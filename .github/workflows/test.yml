name: test

on:
  push:
  pull_request:

jobs:
  api-simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-a-simulation/api-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stage-a-simulation/api-simulator/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test

  web-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-a-simulation/web-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stage-a-simulation/web-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-a-simulation/mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
